name: Update Language Statistics

on:
  schedule:
    - cron: '0 0 1,15 * *'
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: StefVuck/Github-Language-Stats@v1.2.0
        with:
          github_token: ${{ secrets.LANG_STATS }}
          visualization_types: "horizontal-bar donut bar"
          exclude_languages: "HTML,CSS,Markdown,Nushell,Shell,Makefile"
          exclude_repos: "hshare"
          output_path: "stats"
          include_forks: true
