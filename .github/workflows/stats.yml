name: Update Language Statistics

on:
  - push

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: StefVuck/Github-Language-Stats@v1.2.0
        with:
          github_token: ${{ secrets.LANG_STATS }}
          visualization_types: "horizontal-bar donut bar"
          exclude_languages: "HTML,CSS,Markdown"
          exclude_repos: "hshare"
          output_path: "stats"
          include_forks: true
